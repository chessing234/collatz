name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    name: Lean CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test proof-escape scanner
        run: python3 scripts/test_check_proof_escapes.py

      - name: Check generated first-crossing certificates
        run: python3 scripts/generate_first_light_1024.py --check

      - name: Build and setup Lean
        id: lean-action
        uses: leanprover/lean-action@v1
        with:
          # The project has no Lake test target, so keep testing disabled.
          auto-config: false
          build: true
          # Build the library before lean-action saves the Lake cache.
          build-args: Collatz
          test: false
          # lean-action caches the .lake directory by default; make it explicit.
          use-github-cache: true

      - name: Check integrity
        run: ./scripts/check_integrity.sh

      - name: Check anchored barriers and finite cycle certificates
        run: |
          python3 scripts/audit_barrier_kernel.py
          python3 scripts/audit_interval_capacity.py
          python3 scripts/audit_floor_excursion.py
          python3 scripts/audit_five_band_clock.py
          python3 scripts/audit_rational_band_obstruction.py
          python3 scripts/audit_wider_band_clock.py
          python3 scripts/audit_six_band_prefixes.py
          python3 scripts/audit_balanced_offset.py
          python3 scripts/audit_balanced_near_six.py
          python3 scripts/audit_coefficient_band.py
          python3 scripts/audit_floor_affine_error.py
          python3 scripts/audit_floor_product_error.py
          python3 scripts/audit_product_spread_obstruction.py
          python3 scripts/audit_floor_budget_comparison.py
          python3 scripts/audit_exact_trace_product.py
          python3 scripts/audit_floor_product_descent.py
          python3 scripts/audit_product_delay_certificates.py
          python3 scripts/audit_product_thresholds.py
          python3 scripts/audit_coefficient_gap_threshold.py
          python3 scripts/audit_sharp_finite_survival.py
          python3 scripts/audit_sharp_survival_counts.py
          python3 scripts/audit_gap_endpoint_certificates.py
          python3 scripts/audit_finite_beatty_barrier.py
          python3 scripts/audit_certified_first_crossing.py
          python3 scripts/audit_exact_survival_counts.py
          python3 scripts/audit_eleven_halves_clock.py

      - name: Check exact first-descent intervals
        run: |
          python3 scripts/descent_intervals.py --check
          python3 scripts/test_descent_intervals.py
          python3 scripts/audit_descent_intervals.py

      - name: Check weighted excursion crossings
        run: |
          python3 scripts/audit_excursion_crossing.py
          python3 scripts/audit_excursion_switch_floor.py

      - name: Check coefficient crossing and interval transfer
        run: python3 scripts/audit_coefficient_descent.py

      - name: Check stopping atlas and horizon extension
        run: python3 scripts/audit_stopping_atlas.py

      - name: Check depth-fifteen passage atlas and horizon 2592
        run: python3 scripts/audit_passage_atlas.py

      - name: Check odd-run excursion budgets
        run: |
          lake env lean scripts/audit_excursion_budget.lean
          python3 scripts/audit_excursion_budget.py

      - name: Check valuation-stratified excursion products
        run: |
          lake env lean scripts/audit_excursion_lattice.lean
          lake env lean scripts/audit_excursion_mixed_grid.lean
          python3 scripts/audit_excursion_lattice.py

      - name: Check full-history excursion residues
        run: |
          lake env lean scripts/audit_excursion_history_grid.lean
          python3 scripts/audit_excursion_history_grid.py

      - name: Check distinct excursion source assignments
        run: |
          lake env lean scripts/audit_excursion_greedy_slots.lean
          python3 scripts/audit_excursion_greedy_slots.py

      - name: Check excursion source classes and descent thresholds
        run: |
          lake env lean scripts/audit_excursion_rays.lean
          python3 scripts/audit_excursion_rays.py

      - name: Check bounded excursion alphabets and repeated windows
        run: |
          lake env lean scripts/audit_excursion_alphabet.lean
          python3 scripts/audit_excursion_alphabet.py

      - name: Check reciprocal products for sparse excursions
        run: |
          lake env lean scripts/audit_excursion_sparse_product.lean
          python3 scripts/audit_excursion_sparse_product.py

      - name: Check orbit occupation and affine multiplier bounds
        run: |
          lake env lean scripts/audit_orbit_capacity.lean
          python3 scripts/audit_orbit_capacity.py

      - name: Check the bootstrapped orbit occupation bound
        run: |
          lake env lean scripts/audit_orbit_occupation_bootstrap.lean
          python3 scripts/audit_orbit_occupation_bootstrap.py

      - name: Check translated orbit windows and multiplier occupation
        run: |
          lake env lean scripts/audit_orbit_window_bootstrap.lean
          python3 scripts/audit_orbit_window_bootstrap.py

      - name: Check near-critical orbit windows
        run: |
          lake env lean scripts/audit_orbit_near_return.lean
          python3 scripts/audit_orbit_near_return.py

      - name: Check synchronous Collatz classes and inverse fibers
        run: |
          lake env lean scripts/audit_synchronous_classes.lean
          python3 scripts/audit_synchronous_classes.py

      - name: Check the dynamics of least synchronous representatives
        run: |
          lake env lean scripts/audit_synchronous_dynamics.lean
          python3 scripts/audit_synchronous_dynamics.py

      - name: Check reduced multiplier growth of synchronous representatives
        run: |
          lake env lean scripts/audit_synchronous_growth.lean
          python3 scripts/audit_synchronous_growth.py

      - name: Check the earliest synchronous meetings after odd runs
        run: |
          lake env lean scripts/audit_synchronous_excursion.lean
          python3 scripts/audit_synchronous_excursion.py

      - name: Check uniform peak meetings and exponent reductions
        run: |
          lake env lean scripts/audit_peak_contraction.lean
          python3 scripts/audit_peak_contraction.py

      - name: Check inverse fiber transport and stable minimum profiles
        run: |
          lake env lean scripts/audit_inverse_fiber_transport.lean
          python3 scripts/audit_inverse_fiber_transport.py

      - name: Check finite inverse suffix tables and ternary obstructions
        run: |
          lake env lean scripts/audit_peak_suffix_table.lean
          python3 scripts/audit_peak_suffix_table.py

      - name: Check bounded even defects and long-run peak rigidity
        run: |
          lake env lean scripts/audit_long_run_peak_rigidity.lean
          python3 scripts/audit_long_run_peak_rigidity.py

      - name: Check delayed synchronous meetings and progression ancestors
        run: |
          lake env lean scripts/audit_gap_ancestors.lean
          python3 scripts/audit_gap_ancestors.py

      - name: Check compressed Collatz backtraces and periodic targets
        run: |
          lake env lean scripts/audit_backtrace_compression.lean
          python3 scripts/audit_backtrace_compression.py

      - name: Check exact minima from short inverse fibers
        run: |
          lake env lean scripts/audit_short_prefix_minimum.lean
          python3 scripts/audit_short_prefix_minimum.py

      - name: Check unequal-depth separation of scaled peaks
        run: |
          lake env lean scripts/audit_unequal_peak_depth.lean
          python3 scripts/audit_unequal_peak_depth.py
